<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>CGU Postal Mail Checker - History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 data-i18n="history">查詢紀錄</h1>
    <div class="button-row">
      <button id="refresh" data-i18n="refresh">重新整理</button>
      <button id="exportJson" class="secondary" data-i18n="exportJson">匯出 JSON</button>
      <button id="clearLogs" class="danger" data-i18n="clearLogs">清除紀錄</button>
    </div>
    <p class="small" data-i18n="historyNote">最多保留最近 500 筆紀錄。沒有郵件與今日已提醒過的查詢都只會記錄在這裡，不會跳通知。</p>
    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th data-i18n="time">時間</th>
            <th data-i18n="type">類型</th>
            <th data-i18n="recipients">收件人</th>
            <th data-i18n="count">數量</th>
            <th data-i18n="message">訊息</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="history.js"></script>
</body>
</html>
